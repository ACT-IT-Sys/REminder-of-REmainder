<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outstanding Freight Reminder</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      /* Custom scrollbar and subtle transitions */
      body {
        background-color: #f8fafc;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-800 flex flex-col">
    <!-- Header Section -->
    <header class="bg-slate-900 text-white shadow-md">
      <div
        class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4"
      >
        <h1
          id="app-title"
          class="text-xl font-bold tracking-tight flex items-center gap-2"
        >
          <span>📦</span> Outstanding Freight Reminder
        </h1>

        <!-- View Mode Selector -->
        <div class="flex items-center gap-2 text-sm">
          <label for="view-mode-select" class="text-slate-400">View By:</label>
          <select
            id="view-mode-select"
            class="bg-slate-800 border border-slate-700 text-white rounded px-3 py-1.5 focus:outline-none focus:border-blue-500"
          >
            <option value="bl">Bill of Lading (BL)</option>
            <option value="cnee">Consignee (CNEE)</option>
            <option value="invoice">Invoice Number</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Main Control & Search Bar -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full flex flex-col gap-6">
      <div
        class="flex flex-col sm:flex-row gap-4 justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200"
      >
        <!-- Search Input -->
        <div class="w-full sm:w-96 relative">
          <span
            class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"
            >🔍</span
          >
          <input
            type="text"
            id="search-input"
            placeholder="Search BL, Consignee, or Invoice No..."
            class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
          />
        </div>

        <!-- Quick Status Filter Pills / Sorting -->
        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
          <span
            id="record-count"
            class="text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full"
            >Loading records...</span
          >
        </div>
      </div>

      <!-- Dashboard Dynamic Content Container -->
      <div id="dashboard-container" class="grid grid-cols-1 gap-4">
        <!-- Loading State Placeholder -->
        <div
          class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center text-slate-500"
        >
          <div
            class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-200 border-t-blue-600 mb-2"
          ></div>
          <p>Fetching freight data from Google Sheets...</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400"
    >
      ACT Global Logistics • Powered by Google Sheets & GitHub Pages
    </footer>

    <!-- Scripts (Must be included here so config and app load properly) -->
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
