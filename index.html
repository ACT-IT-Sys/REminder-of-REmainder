<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outstanding Freight Reminder</title>
    <!-- Local Lightweight Stylesheet for Maximum Mobile Speed -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="o.css" />
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <div
        class="max-w-7xl px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4"
      >
        <h1 class="text-lg font-bold flex items-center gap-2">
          <span>📦</span> Outstanding Freight Reminder
        </h1>

        <!-- View Mode Selector -->
        <div class="flex items-center gap-2 text-sm">
          <label for="view-mode-select" class="text-slate-400">View By:</label>
          <select
            id="view-mode-select"
            class="bg-slate-50 border border-slate-700 text-slate-900 rounded px-3 py-2"
            style="background-color: #1e293b; color: white"
          >
            <option value="bl">Bill of Lading (BL)</option>
            <option value="cnee">Consignee (CNEE)</option>
            <option value="invoice">Invoice Number</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Main Control & Search Bar -->
    <main class="max-w-7xl px-4 py-6 flex-1 w-full flex flex-col gap-6">
      <div
        class="flex flex-col sm:flex-row gap-4 justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200"
      >
        <!-- Search Input -->
        <div class="w-full sm:w-96 relative flex items-center">
          <span style="position: absolute; left: 0.75rem">🔍</span>
          <input
            type="text"
            id="search-input"
            placeholder="Search BL, Consignee, or Invoice No..."
            class="w-full"
            style="
              padding: 0.5rem 1rem 0.5rem 2.5rem;
              background-color: #f8fafc;
              border: 1px solid #e2e8f0;
              border-radius: 0.5rem;
            "
          />
        </div>

        <!-- Quick Status Filter Pills / Sorting -->
        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
          <span
            id="record-count"
            class="text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full"
            >Loading records...</span
          >
        </div>
      </div>

      <!-- Dashboard Dynamic Content Container -->
      <div id="dashboard-container" class="flex flex-col gap-4">
        <!-- Loading State Placeholder -->
        <div
          class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center text-slate-500"
        >
          <p>Fetching freight data from Google Sheets...</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400"
    >
      ACT Global Logistics • Powered by Google Sheets & GitHub Pages
    </footer>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
